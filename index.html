<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>IP Cím Lekérdező</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #121212; color: white; }
    .box { text-align: center; border: 1px solid #333; padding: 2rem; border-radius: 8px; }
    h1 { font-size: 2.5rem; color: #00d1b2; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Az Ön IP-címe:</h2>
    <h1 id="ip">Betöltés...</h1>
  </div>

  <script>
    // IP szolgáltatók listája
    const apis = [
      () => fetch('https://api.myip.com').then(res => res.json()).then(d => d.ip),
      () => fetch('https://api.ipify.org?format=json').then(res => res.json()).then(d => d.ip),
      () => fetch('https://ipapi.co/json/').then(res => res.json()).then(d => d.ip)
    ];

    async function getIP() {
      for (const apiCall of apis) {
        try {
          const ip = await apiCall();
          if (ip) {
            document.getElementById('ip').innerText = ip;
            return;
          }
        } catch (e) {
          console.warn('API hiba, próbálkozás a következővel...');
        }
      }
      document.getElementById('ip').innerText = 'Nem sikerült az IP lekérése (AdBlocker tilthatja)';
    }

    getIP();
  </script>
</body>
</html>
